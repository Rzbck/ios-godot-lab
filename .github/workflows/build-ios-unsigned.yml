name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/iphone-lab-v2-20260908

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_NAME: "IOSGodotLab"
  EXPORT_PRESET: "iOS"
  IOS_HEADERS_SHA256: "5e3d897df72fd5cca1979b024380d74f965802fc7388874e57a40d6a48c84610"

jobs:
  build-ios:
    name: Export Xcode and build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_ARCHIVE="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"

          TEMPLATES_ARCHIVE="$RUNNER_TEMP/templates.tpz"
          TEMPLATES_UNPACK="$RUNNER_TEMP/templates-unpack"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$GODOT_DIR" "$TEMPLATES_UNPACK" "$TEMPLATES_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output "$GODOT_ARCHIVE"
          unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$TEMPLATES_URL" --output "$TEMPLATES_ARCHIVE"
          unzip -q "$TEMPLATES_ARCHIVE" -d "$TEMPLATES_UNPACK"
          cp -R "$TEMPLATES_UNPACK/templates/." "$TEMPLATES_DIR/"

          GODOT_BIN="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version
          test -f "$TEMPLATES_DIR/ios.zip"

      - name: Generate iOS visual assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_ios_visual_assets.py --output assets/generated
          test -s assets/generated/ios_app_icon_1024.png
          test -s assets/generated/launch_2x.png
          test -s assets/generated/launch_3x.png
          file assets/generated/ios_app_icon_1024.png
          file assets/generated/launch_2x.png
          file assets/generated/launch_3x.png

      - name: Build IOSLab native bridge
        shell: bash
        run: |
          set -euo pipefail

          HEADERS_ARCHIVE="$RUNNER_TEMP/godot-ios-headers.zip"
          HEADERS_DIR="$RUNNER_TEMP/godot-ios-headers"
          HEADERS_URL="https://github.com/godot-mobile-plugins/godot-ios-builds/releases/download/${GODOT_VERSION}-stable/godot-headers-${GODOT_VERSION}-stable.zip"
          OBJECT_FILE="$RUNNER_TEMP/ios_lab_plugin.o"
          STATIC_LIB="$RUNNER_TEMP/libIOSLab.a"
          PLUGIN_DIR="$GITHUB_WORKSPACE/ios/plugins/IOSLab"

          mkdir -p "$HEADERS_DIR" "$PLUGIN_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$HEADERS_URL" --output "$HEADERS_ARCHIVE"
          ACTUAL_HEADERS_SHA256="$(shasum -a 256 "$HEADERS_ARCHIVE" | awk '{print $1}')"
          if [ "$ACTUAL_HEADERS_SHA256" != "$IOS_HEADERS_SHA256" ]; then
            echo "Godot iOS headers SHA-256 mismatch." >&2
            echo "Expected: $IOS_HEADERS_SHA256" >&2
            echo "Actual:   $ACTUAL_HEADERS_SHA256" >&2
            exit 1
          fi

          unzip -q "$HEADERS_ARCHIVE" -d "$HEADERS_DIR"
          HEADER_FILE="$(find "$HEADERS_DIR" -type f -path '*/core/object/object.h' | head -n 1)"
          if [ -z "$HEADER_FILE" ]; then
            echo "Could not locate core/object/object.h in Godot iOS headers." >&2
            find "$HEADERS_DIR" -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          HEADER_ROOT="${HEADER_FILE%/core/object/object.h}"
          IOS_SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "HEADER_ROOT=$HEADER_ROOT"
          echo "IOS_SDK_PATH=$IOS_SDK_PATH"

          xcrun --sdk iphoneos clang++ \
            -std=c++17 \
            -fobjc-arc \
            -fmodules \
            -fcxx-modules \
            -fblocks \
            -arch arm64 \
            -miphoneos-version-min=16.0 \
            -isysroot "$IOS_SDK_PATH" \
            -I"$HEADER_ROOT/platform/ios" \
            -I"$HEADER_ROOT" \
            -DIOS_ENABLED \
            -DAPPLE_EMBEDDED_ENABLED \
            -DUNIX_ENABLED \
            -DPTRCALL_ENABLED \
            -c "$GITHUB_WORKSPACE/native/ioslab/ios_lab_plugin.mm" \
            -o "$OBJECT_FILE"

          xcrun libtool -static -o "$STATIC_LIB" "$OBJECT_FILE"

          rm -rf "$PLUGIN_DIR/IOSLab.xcframework"
          xcodebuild -create-xcframework \
            -library "$STATIC_LIB" \
            -output "$PLUGIN_DIR/IOSLab.xcframework"

          cp "$GITHUB_WORKSPACE/native/ioslab/IOSLab.gdip" "$PLUGIN_DIR/IOSLab.gdip"

          test -f "$PLUGIN_DIR/IOSLab.gdip"
          test -f "$PLUGIN_DIR/IOSLab.xcframework/Info.plist"
          find "$PLUGIN_DIR" -maxdepth 4 -type f -print

      - name: Stamp exact build identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          cat > config/build_info.json <<EOF
          {
            "version": "0.4.0-dev",
            "git_sha": "$SHORT_SHA",
            "channel": "github-actions-ios",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat config/build_info.json

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import

      - name: Export Godot Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "$EXPORT_PRESET" "build/ios/${PROJECT_NAME}.xcodeproj"

          XCODEPROJ="$(find build/ios -maxdepth 2 -type d -name '*.xcodeproj' | head -n 1)"
          if [ -z "$XCODEPROJ" ]; then
            echo "No Xcode project generated by Godot." >&2
            exit 1
          fi
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "Generated: $XCODEPROJ"
          xcodebuild -project "$XCODEPROJ" -list

      - name: Build iPhoneOS app without code signing
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -path '*Release-iphoneos/*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No Release-iphoneos .app found." >&2
            find "$DERIVED_DATA/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"

      - name: Assert unsigned app and package IPA
        shell: bash
        run: |
          set -euo pipefail

          if codesign --verify --deep --strict "$APP_PATH" >/dev/null 2>&1; then
            echo "Expected an unsigned app, but codesign verification succeeded." >&2
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/build/artifacts"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_NAME="${PROJECT_NAME}-unsigned-${GITHUB_SHA:0:12}.ipa"
          mkdir -p "$OUT_DIR" "$PACKAGE_DIR/Payload"

          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$(basename "$APP_PATH")"
          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$OUT_DIR/$IPA_NAME" Payload
          )

          GODOT_ID="$($GODOT_BIN --version | head -n 1)"
          XCODE_ID="$(xcodebuild -version | tr '\n' ' ')"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"

          cat > "$OUT_DIR/BUILD-METADATA.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "godot": "${GODOT_ID}",
            "xcode": "${XCODE_ID}",
            "iphoneos_sdk": "${IOS_SDK}",
            "runner": "macos-26",
            "signed": false,
            "native_bridge": "IOSLab",
            "ipa": "${IPA_NAME}"
          }
          EOF

          shasum -a 256 "$OUT_DIR/$IPA_NAME" | tee "$OUT_DIR/$IPA_NAME.sha256"
          cat "$OUT_DIR/BUILD-METADATA.json"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14
