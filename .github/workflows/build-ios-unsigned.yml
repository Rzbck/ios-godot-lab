name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/ios-foundation-20260907

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_NAME: "IOSGodotLab"
  EXPORT_PRESET: "iOS"

jobs:
  build-ios:
    name: Export Xcode and build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_ARCHIVE="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"

          TEMPLATES_ARCHIVE="$RUNNER_TEMP/templates.tpz"
          TEMPLATES_UNPACK="$RUNNER_TEMP/templates-unpack"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$GODOT_DIR" "$TEMPLATES_UNPACK" "$TEMPLATES_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output "$GODOT_ARCHIVE"
          unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$TEMPLATES_URL" --output "$TEMPLATES_ARCHIVE"
          unzip -q "$TEMPLATES_ARCHIVE" -d "$TEMPLATES_UNPACK"
          cp -R "$TEMPLATES_UNPACK/templates/." "$TEMPLATES_DIR/"

          GODOT_BIN="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version
          test -f "$TEMPLATES_DIR/ios.zip"

      - name: Stamp exact build identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          cat > config/build_info.json <<EOF
          {
            "version": "0.1.0-dev",
            "git_sha": "$SHORT_SHA",
            "channel": "github-actions-ios",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat config/build_info.json

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import

      - name: Export Godot Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "$EXPORT_PRESET" "build/ios/${PROJECT_NAME}.xcodeproj"

          XCODEPROJ="$(find build/ios -maxdepth 2 -type d -name '*.xcodeproj' | head -n 1)"
          if [[ -z "$XCODEPROJ" ]]; then
            echo "No Xcode project generated by Godot." >&2
            exit 1
          fi
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "Generated: $XCODEPROJ"
          xcodebuild -project "$XCODEPROJ" -list

      - name: Build iPhoneOS app without code signing
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -path '*Release-iphoneos/*.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No Release-iphoneos .app found." >&2
            find "$DERIVED_DATA/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"

      - name: Assert unsigned app and package IPA
        shell: bash
        run: |
          set -euo pipefail

          if codesign --verify --deep --strict "$APP_PATH" >/dev/null 2>&1; then
            echo "Expected an unsigned app, but codesign verification succeeded." >&2
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/build/artifacts"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_NAME="${PROJECT_NAME}-unsigned-${GITHUB_SHA:0:12}.ipa"
          mkdir -p "$OUT_DIR" "$PACKAGE_DIR/Payload"

          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$(basename "$APP_PATH")"
          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$OUT_DIR/$IPA_NAME" Payload
          )

          GODOT_ID="$($GODOT_BIN --version | head -n 1)"
          XCODE_ID="$(xcodebuild -version | tr '\n' ' ')"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"

          cat > "$OUT_DIR/BUILD-METADATA.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "godot": "${GODOT_ID}",
            "xcode": "${XCODE_ID}",
            "iphoneos_sdk": "${IOS_SDK}",
            "runner": "macos-26",
            "signed": false,
            "ipa": "${IPA_NAME}"
          }
          EOF

          shasum -a 256 "$OUT_DIR/$IPA_NAME" | tee "$OUT_DIR/$IPA_NAME.sha256"
          cat "$OUT_DIR/BUILD-METADATA.json"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14
