name: Watch Sensor Lab bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/watch-sensor-*'
    paths:
      - 'apps/watch-sensor-lab/iphone/**'
      - 'apps/watch-sensor-lab/watch/**'
      - 'apps/watch-sensor-lab/Shared/**'
      - 'apps/watch-sensor-lab/godot/**'
      - 'apps/watch-sensor-lab/GENERATE_APP_ICON.py'
      - '.github/workflows/watch-sensor-lab-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: watch-sensor-lab-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  XCODEGEN_VERSION: '2.46.0'
  APP_DIR: apps/watch-sensor-lab
  IPHONE_BUNDLE_ID: com.rzbck.watchsensorlab
  WATCH_BUNDLE_ID: com.rzbck.watchsensorlab.watchkitapp

jobs:
  build-bootstrap:
    name: Build native iPhone + embedded watchOS companion
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-version

      - name: Stamp exact build identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          mkdir -p "$APP_DIR/godot/config" "$APP_DIR/iphone/Sources" "$APP_DIR/watch/Sources"
          cat > "$APP_DIR/godot/config/build_info.json" <<EOF
          {
            "version": "0.2.0-dev",
            "git_sha": "$SHORT_SHA",
            "channel": "github-actions-native-tracker"
          }
          EOF
          cat > "$APP_DIR/iphone/Sources/BuildInfo.swift" <<EOF
          enum BuildInfo {
              static let gitSHA = "$SHORT_SHA"
          }
          EOF
          cat > "$APP_DIR/watch/Sources/BuildInfo.swift" <<EOF
          enum BuildInfo {
              static let gitSHA = "$SHORT_SHA"
          }
          EOF

      - name: Verify retained Godot recorder prototype
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ARCHIVE="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output "$GODOT_ARCHIVE"
          unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --path "$APP_DIR/godot" --import
          "$GODOT_BIN" --headless --path "$APP_DIR/godot" --quit-after 2

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          URL="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" --output "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$DEST"
          XCODEGEN_BIN="$(find "$DEST" -type f -name xcodegen | head -n 1)"
          if [ -z "$XCODEGEN_BIN" ]; then
            echo "xcodegen binary not found in release archive." >&2
            exit 1
          fi
          chmod +x "$XCODEGEN_BIN"
          echo "XCODEGEN_BIN=$XCODEGEN_BIN" >> "$GITHUB_ENV"
          "$XCODEGEN_BIN" --version

      - name: Generate native iPhone project
        shell: bash
        run: |
          set -euo pipefail
          IPHONE_DIR="$GITHUB_WORKSPACE/$APP_DIR/iphone"
          "$XCODEGEN_BIN" generate --spec "$IPHONE_DIR/project.yml" --project "$IPHONE_DIR"
          IPHONE_XCODEPROJ="$IPHONE_DIR/WatchSensorLab.xcodeproj"
          test -d "$IPHONE_XCODEPROJ"
          echo "IPHONE_XCODEPROJ=$IPHONE_XCODEPROJ" >> "$GITHUB_ENV"
          xcodebuild -project "$IPHONE_XCODEPROJ" -list

      - name: Build unsigned native iPhone app
        shell: bash
        run: |
          set -euo pipefail
          IPHONE_DERIVED="$RUNNER_TEMP/DerivedData-iPhone"
          rm -rf "$IPHONE_DERIVED"
          xcodebuild \
            -project "$IPHONE_XCODEPROJ" \
            -scheme WatchSensorLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$IPHONE_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          IPHONE_APP_PATH="$(find "$IPHONE_DERIVED/Build/Products" -type d -path '*Release-iphoneos/*.app' | head -n 1)"
          if [ -z "$IPHONE_APP_PATH" ]; then
            echo "No native iPhone .app produced." >&2
            exit 1
          fi
          echo "IPHONE_APP_PATH=$IPHONE_APP_PATH" >> "$GITHUB_ENV"

      - name: Generate and build unsigned watchOS app
        shell: bash
        run: |
          set -euo pipefail
          WATCH_DIR="$GITHUB_WORKSPACE/$APP_DIR/watch"
          "$XCODEGEN_BIN" generate --spec "$WATCH_DIR/project.yml" --project "$WATCH_DIR"

          WATCH_XCODEPROJ="$WATCH_DIR/WatchSensorLabWatch.xcodeproj"
          test -d "$WATCH_XCODEPROJ"
          xcodebuild -project "$WATCH_XCODEPROJ" -list

          WATCH_DERIVED="$RUNNER_TEMP/DerivedData-watch"
          rm -rf "$WATCH_DERIVED"
          xcodebuild \
            -project "$WATCH_XCODEPROJ" \
            -scheme WatchSensorLabWatch \
            -configuration Release \
            -sdk watchos \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$WATCH_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          WATCH_APP_PATH="$(find "$WATCH_DERIVED/Build/Products" -type d -path '*Release-watchos/*.app' | head -n 1)"
          if [ -z "$WATCH_APP_PATH" ]; then
            echo "No watchOS .app produced." >&2
            exit 1
          fi

          WATCH_APPLICATION="$(/usr/libexec/PlistBuddy -c 'Print :WKApplication' "$WATCH_APP_PATH/Info.plist")"
          echo "Watch WKApplication: $WATCH_APPLICATION"
          test "$WATCH_APPLICATION" = "true"
          echo "WATCH_APP_PATH=$WATCH_APP_PATH" >> "$GITHUB_ENV"

      - name: Verify HealthKit declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'com.apple.developer.healthkit' "$APP_DIR/iphone/Sources/WatchSensorLab.entitlements"
          grep -Fq 'com.apple.developer.healthkit' "$APP_DIR/watch/Sources/WatchSensorLab.entitlements"
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$IPHONE_APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' "$WATCH_APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$IPHONE_APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$WATCH_APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSMotionUsageDescription' "$IPHONE_APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSMotionUsageDescription' "$WATCH_APP_PATH/Info.plist" >/dev/null

      - name: Assemble iPhone app with embedded watchOS companion
        shell: bash
        run: |
          set -euo pipefail
          COMBINED_ROOT="$RUNNER_TEMP/combined-app"
          rm -rf "$COMBINED_ROOT"
          mkdir -p "$COMBINED_ROOT"

          COMBINED_APP_PATH="$COMBINED_ROOT/$(basename "$IPHONE_APP_PATH")"
          ditto "$IPHONE_APP_PATH" "$COMBINED_APP_PATH"

          mkdir -p "$COMBINED_APP_PATH/Watch"
          EMBEDDED_WATCH_PATH="$COMBINED_APP_PATH/Watch/$(basename "$WATCH_APP_PATH")"
          ditto "$WATCH_APP_PATH" "$EMBEDDED_WATCH_PATH"

          IPHONE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$COMBINED_APP_PATH/Info.plist")"
          WATCH_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EMBEDDED_WATCH_PATH/Info.plist")"
          COMPANION_ID="$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$EMBEDDED_WATCH_PATH/Info.plist")"
          RUNS_INDEPENDENT="$(/usr/libexec/PlistBuddy -c 'Print :WKRunsIndependentlyOfCompanionApp' "$EMBEDDED_WATCH_PATH/Info.plist")"
          WATCH_APPLICATION="$(/usr/libexec/PlistBuddy -c 'Print :WKApplication' "$EMBEDDED_WATCH_PATH/Info.plist")"

          echo "iPhone bundle: $IPHONE_ID"
          echo "Watch bundle: $WATCH_ID"
          echo "Watch companion: $COMPANION_ID"
          echo "Watch independent: $RUNS_INDEPENDENT"
          echo "Watch WKApplication: $WATCH_APPLICATION"

          test "$IPHONE_ID" = "$IPHONE_BUNDLE_ID"
          test "$WATCH_ID" = "$WATCH_BUNDLE_ID"
          test "$COMPANION_ID" = "$IPHONE_BUNDLE_ID"
          test "$RUNS_INDEPENDENT" = "false"
          test "$WATCH_APPLICATION" = "true"
          test -d "$COMBINED_APP_PATH/Watch/$(basename "$WATCH_APP_PATH")"

          echo "COMBINED_APP_PATH=$COMBINED_APP_PATH" >> "$GITHUB_ENV"
          echo "EMBEDDED_WATCH_PATH=$EMBEDDED_WATCH_PATH" >> "$GITHUB_ENV"

      - name: Package exact-SHA companion IPA
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          OUT="$GITHUB_WORKSPACE/build/watch-sensor-lab-companion"
          PACKAGE="$RUNNER_TEMP/iphone-ipa"
          rm -rf "$OUT" "$PACKAGE"
          mkdir -p "$OUT" "$PACKAGE/Payload"

          ditto "$COMBINED_APP_PATH" "$PACKAGE/Payload/$(basename "$COMBINED_APP_PATH")"
          IPA_PATH="$OUT/WatchSensorLab-companion-unsigned-${SHORT_SHA}.ipa"
          (
            cd "$PACKAGE"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          ditto -c -k --sequesterRsrc --keepParent "$WATCH_APP_PATH" "$OUT/WatchSensorLab-Watch-diagnostic-${SHORT_SHA}.zip"

          /usr/bin/unzip -l "$IPA_PATH" > "$OUT/IPA-CONTENTS.txt"
          grep -F "Payload/$(basename "$COMBINED_APP_PATH")/Watch/$(basename "$WATCH_APP_PATH")/Info.plist" "$OUT/IPA-CONTENTS.txt"

          cat > "$OUT/BUILD-METADATA.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "product_shell": "native-swiftui",
            "xcode": "$(xcodebuild -version | tr '\n' ' ')",
            "iphoneos_sdk": "$(xcrun --sdk iphoneos --show-sdk-version)",
            "watchos_sdk": "$(xcrun --sdk watchos --show-sdk-version)",
            "xcodegen": "${XCODEGEN_VERSION}",
            "iphone_bundle_id": "${IPHONE_BUNDLE_ID}",
            "watch_bundle_id": "${WATCH_BUNDLE_ID}",
            "watch_application": true,
            "healthkit_declared": true,
            "signed": false,
            "watch_companion_integrated_in_ipa": true,
            "hardware_validated": false,
            "classification": "CI ASSEMBLED NATIVE TRACKER - HARDWARE NOT VALIDATED"
          }
          EOF

          shasum -a 256 "$IPA_PATH" > "$IPA_PATH.sha256"
          for FILE in "$OUT"/*; do
            if [ "$(basename "$FILE")" = "SHA256SUMS.txt" ]; then
              continue
            fi
            shasum -a 256 "$FILE"
          done > "$OUT/SHA256SUMS.txt"

          cat "$OUT/BUILD-METADATA.json"
          cat "$IPA_PATH.sha256"

      - name: Upload companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-sensor-lab-companion-${{ github.sha }}
          path: build/watch-sensor-lab-companion/
          if-no-files-found: error
          retention-days: 14
