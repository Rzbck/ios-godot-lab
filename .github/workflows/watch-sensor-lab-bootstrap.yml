name: Watch Sensor Lab bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - feat/watch-sensor-lab-bootstrap-20260909
    paths:
      - 'apps/watch-sensor-lab/**'
      - '.github/workflows/watch-sensor-lab-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: watch-sensor-lab-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  XCODEGEN_VERSION: '2.46.0'
  APP_DIR: apps/watch-sensor-lab

jobs:
  build-bootstrap:
    name: Build iPhone and watchOS bootstrap
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-version

      - name: Install pinned Godot and iOS templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_ARCHIVE="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"

          TEMPLATES_ARCHIVE="$RUNNER_TEMP/templates.tpz"
          TEMPLATES_UNPACK="$RUNNER_TEMP/templates-unpack"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$GODOT_DIR" "$TEMPLATES_UNPACK" "$TEMPLATES_DIR"
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output "$GODOT_ARCHIVE"
          unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"

          curl --fail --location --retry 3 --retry-delay 2 "$TEMPLATES_URL" --output "$TEMPLATES_ARCHIVE"
          unzip -q "$TEMPLATES_ARCHIVE" -d "$TEMPLATES_UNPACK"
          cp -R "$TEMPLATES_UNPACK/templates/." "$TEMPLATES_DIR/"

          GODOT_BIN="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version
          test -f "$TEMPLATES_DIR/ios.zip"

      - name: Stamp exact build identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          mkdir -p "$APP_DIR/godot/config"
          cat > "$APP_DIR/godot/config/build_info.json" <<EOF
          {
            "version": "0.1.0-dev",
            "git_sha": "$SHORT_SHA",
            "channel": "github-actions-bootstrap"
          }
          EOF
          cat > "$APP_DIR/watch/Sources/BuildInfo.swift" <<EOF
          enum BuildInfo {
              static let gitSHA = "$SHORT_SHA"
          }
          EOF

      - name: Verify Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$APP_DIR/godot" --import
          "$GODOT_BIN" --headless --path "$APP_DIR/godot" --quit-after 2

      - name: Export Godot iPhone Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/iphone-export"
          mkdir -p "$RUNNER_TEMP/iphone-export"
          "$GODOT_BIN" --headless --path "$APP_DIR/godot" --export-release "iOS" "$RUNNER_TEMP/iphone-export/WatchSensorLab.xcodeproj"

          IPHONE_XCODEPROJ="$(find "$RUNNER_TEMP/iphone-export" -maxdepth 2 -type d -name '*.xcodeproj' | head -n 1)"
          if [ -z "$IPHONE_XCODEPROJ" ]; then
            echo "No iPhone Xcode project generated." >&2
            exit 1
          fi
          echo "IPHONE_XCODEPROJ=$IPHONE_XCODEPROJ" >> "$GITHUB_ENV"
          xcodebuild -project "$IPHONE_XCODEPROJ" -list

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          IPHONE_DERIVED="$RUNNER_TEMP/DerivedData-iPhone"
          rm -rf "$IPHONE_DERIVED"

          xcodebuild \
            -project "$IPHONE_XCODEPROJ" \
            -scheme WatchSensorLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$IPHONE_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          IPHONE_APP_PATH="$(find "$IPHONE_DERIVED/Build/Products" -type d -path '*Release-iphoneos/*.app' | head -n 1)"
          if [ -z "$IPHONE_APP_PATH" ]; then
            echo "No iPhone .app produced." >&2
            exit 1
          fi
          echo "IPHONE_APP_PATH=$IPHONE_APP_PATH" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          URL="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" --output "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$DEST"
          XCODEGEN_BIN="$(find "$DEST" -type f -name xcodegen | head -n 1)"
          if [ -z "$XCODEGEN_BIN" ]; then
            echo "xcodegen binary not found in release archive." >&2
            find "$DEST" -maxdepth 4 -print
            exit 1
          fi
          chmod +x "$XCODEGEN_BIN"
          echo "XCODEGEN_BIN=$XCODEGEN_BIN" >> "$GITHUB_ENV"
          "$XCODEGEN_BIN" --version

      - name: Generate and build unsigned watchOS app
        shell: bash
        run: |
          set -euo pipefail
          WATCH_DIR="$GITHUB_WORKSPACE/$APP_DIR/watch"
          "$XCODEGEN_BIN" generate --spec "$WATCH_DIR/project.yml" --project "$WATCH_DIR"

          WATCH_XCODEPROJ="$WATCH_DIR/WatchSensorLabWatch.xcodeproj"
          test -d "$WATCH_XCODEPROJ"
          xcodebuild -project "$WATCH_XCODEPROJ" -list

          WATCH_DERIVED="$RUNNER_TEMP/DerivedData-watch"
          rm -rf "$WATCH_DERIVED"
          xcodebuild \
            -project "$WATCH_XCODEPROJ" \
            -scheme WatchSensorLabWatch \
            -configuration Release \
            -sdk watchos \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$WATCH_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          WATCH_APP_PATH="$(find "$WATCH_DERIVED/Build/Products" -type d -path '*Release-watchos/*.app' | head -n 1)"
          if [ -z "$WATCH_APP_PATH" ]; then
            echo "No watchOS .app produced." >&2
            exit 1
          fi
          echo "WATCH_APP_PATH=$WATCH_APP_PATH" >> "$GITHUB_ENV"

      - name: Package exact-SHA bootstrap artifact
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          OUT="$GITHUB_WORKSPACE/build/watch-sensor-lab-bootstrap"
          PACKAGE="$RUNNER_TEMP/iphone-ipa"
          mkdir -p "$OUT" "$PACKAGE/Payload"

          ditto "$IPHONE_APP_PATH" "$PACKAGE/Payload/$(basename "$IPHONE_APP_PATH")"
          (
            cd "$PACKAGE"
            /usr/bin/zip -qry "$OUT/WatchSensorLab-iPhone-unsigned-${SHORT_SHA}.ipa" Payload
          )

          ditto -c -k --sequesterRsrc --keepParent "$WATCH_APP_PATH" "$OUT/WatchSensorLab-Watch-unsigned-${SHORT_SHA}.zip"

          cat > "$OUT/BUILD-METADATA.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "godot": "$("$GODOT_BIN" --version | head -n 1)",
            "xcode": "$(xcodebuild -version | tr '\n' ' ')",
            "iphoneos_sdk": "$(xcrun --sdk iphoneos --show-sdk-version)",
            "watchos_sdk": "$(xcrun --sdk watchos --show-sdk-version)",
            "xcodegen": "${XCODEGEN_VERSION}",
            "iphone_bundle_id": "com.rzbck.watchsensorlab",
            "watch_bundle_id": "com.rzbck.watchsensorlab.watchkitapp",
            "signed": false,
            "watch_companion_integrated_in_ipa": false,
            "classification": "BOOTSTRAP BUILD ONLY"
          }
          EOF

          shasum -a 256 "$OUT"/* | tee "$OUT/SHA256SUMS.txt"
          cat "$OUT/BUILD-METADATA.json"

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-sensor-lab-bootstrap-${{ github.sha }}
          path: build/watch-sensor-lab-bootstrap/
          if-no-files-found: error
          retention-days: 14
