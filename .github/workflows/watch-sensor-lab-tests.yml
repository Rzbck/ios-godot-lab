name: Watch Sensor Lab tests
run-name: Watch Sensor Lab tests · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/watch-sensor-lab/**'
      - '.github/workflows/watch-sensor-lab-tests.yml'
      - '.github/workflows/watch-sensor-lab-bootstrap.yml'
      - '.github/workflows/watch-sensor-lab-bootstrap.yml'
  push:
    branches:
      - main
      - 'feat/watch-sensor-*'
      - 'fix/watch-*'
    paths:
      - 'apps/watch-sensor-lab/iphone/**'
      - 'apps/watch-sensor-lab/watch/**'
      - 'apps/watch-sensor-lab/Shared/**'
      - 'apps/watch-sensor-lab/Tests/**'
      - 'apps/watch-sensor-lab/UITests/**'
      - 'apps/watch-sensor-lab/UITestHarness/**'
      - 'apps/watch-sensor-lab/SESSION_SYNC_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_GENERATED_SOURCE_CHAIN.py'
      - 'apps/watch-sensor-lab/*PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_AUTO_BEHAVIOR_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_AUTO_PAUSE_SAFETY_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_AUTO_PAUSE_FUSION_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_AUTO_RESUME_RUNTIME_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_RUNTIME_INTEGRITY_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_TERMINAL_SYNC_RELIABILITY_PATCH.py'
      - 'apps/watch-sensor-lab/APPLY_HISTORICAL_CORRECTION_DISTANCE_PATCH.py'
      - 'apps/watch-sensor-lab/RUN_HISTORICAL_CORRECTION_DISTANCE_PATCH.py'
      - 'apps/watch-sensor-lab/GENERATE_APP_ICON.py'
      - 'apps/watch-sensor-lab/CHECK_WORKFLOW_PARITY.py'
      - 'apps/watch-sensor-lab/CHECK_PRODUCT_INVARIANTS.py'
      - '.github/workflows/watch-sensor-lab-tests.yml'

permissions:
  contents: read

concurrency:
  group: watch-sensor-lab-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
  APP_DIR: apps/watch-sensor-lab

jobs:
  preflight:
    name: Static preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Python identity
        shell: bash
        run: |
          set -euo pipefail
          python3 --version

      - name: Apply complete generated-source chain twice
        shell: bash
        run: |
          set -euo pipefail
          python3 "$APP_DIR/APPLY_GENERATED_SOURCE_CHAIN.py"
          python3 "$APP_DIR/APPLY_GENERATED_SOURCE_CHAIN.py"

      - name: Verify static workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 "$APP_DIR/CHECK_WORKFLOW_PARITY.py"
          python3 "$APP_DIR/CHECK_PRODUCT_INVARIANTS.py"

  tests:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - slug: iphone-contract
            label: iPhone contract
            platform: iphone
            kind: contract
            test_name: contract
          - slug: watch-contract
            label: watchOS contract
            platform: watch
            kind: contract
            test_name: contract
          - slug: iphone-ui-force
            label: iPhone UI · force
            platform: iphone
            kind: ui
            test_name: testAutoFinishCanConfirmSuggestedConcreteSport
          - slug: iphone-ui-preserve
            label: iPhone UI · preserve
            platform: iphone
            kind: ui
            test_name: testAutoFinishCanPreserveDetectedSegments
          - slug: iphone-ui-cancel
            label: iPhone UI · cancel
            platform: iphone
            kind: ui
            test_name: testFinishReviewCanBeCancelledWithoutFinishing
          - slug: watch-ui-force
            label: watchOS UI · force
            platform: watch
            kind: ui
            test_name: testAutoFinishCanForceSuggestedConcreteSport
          - slug: watch-ui-preserve
            label: watchOS UI · preserve
            platform: watch
            kind: ui
            test_name: testAutoFinishCanPreserveDetection
          - slug: watch-ui-cancel
            label: watchOS UI · cancel
            platform: watch
            kind: ui
            test_name: testFinishReviewCanBeCancelled

    env:
      CASE_SLUG: ${{ matrix.slug }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TEST_KIND: ${{ matrix.kind }}
      TEST_NAME: ${{ matrix.test_name }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version

      - name: Apply complete generated-source chain twice
        shell: bash
        run: |
          set -euo pipefail
          python3 "$APP_DIR/APPLY_GENERATED_SOURCE_CHAIN.py"
          python3 "$APP_DIR/APPLY_GENERATED_SOURCE_CHAIN.py"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          DEST="$RUNNER_TEMP/xcodegen"
          URL="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          mkdir -p "$DEST"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" --output "$ARCHIVE"
          echo "${XCODEGEN_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$DEST"
          XCODEGEN_BIN="$(find "$DEST" -type f -name xcodegen | head -n 1)"
          test -n "$XCODEGEN_BIN"
          chmod +x "$XCODEGEN_BIN"
          echo "XCODEGEN_BIN=$XCODEGEN_BIN" >> "$GITHUB_ENV"
          "$XCODEGEN_BIN" --version

      - name: Generate target project
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_PLATFORM" = "iphone" ]; then
            "$XCODEGEN_BIN" generate \
              --spec "$GITHUB_WORKSPACE/$APP_DIR/iphone/project.yml" \
              --project "$GITHUB_WORKSPACE/$APP_DIR/iphone"
          else
            "$XCODEGEN_BIN" generate \
              --spec "$GITHUB_WORKSPACE/$APP_DIR/watch/project.yml" \
              --project "$GITHUB_WORKSPACE/$APP_DIR/watch"
          fi

      - name: Select current simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > "$RUNNER_TEMP/test-destination.env"
          import json
          import os
          import re
          import subprocess

          platform = os.environ["TARGET_PLATFORM"]
          runtime_token = ".iOS-" if platform == "iphone" else ".watchOS-"
          device_prefix = "iPhone" if platform == "iphone" else "Apple Watch"

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )

          def runtime_version(runtime):
              match = re.search(r"-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not match:
                  return (0, 0, 0)
              return tuple(int(value or 0) for value in match.groups())

          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if runtime_token not in runtime:
                  continue
              version = runtime_version(runtime)
              for device in devices:
                  if not device.get("isAvailable", False):
                      continue
                  if not device.get("name", "").startswith(device_prefix):
                      continue
                  candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit(
                  f"No available {device_prefix} simulator for {runtime_token}"
              )

          candidates.sort(reverse=True)
          _, name, udid = candidates[0]
          print(f"DEVICE_UDID={udid}")
          print(f"DEVICE_NAME={name}")
          PY

          cat "$RUNNER_TEMP/test-destination.env"
          cat "$RUNNER_TEMP/test-destination.env" >> "$GITHUB_ENV"

      - name: Run selected test
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$RUNNER_TEMP/WatchSensorLab-${CASE_SLUG}.xcresult"
          SUMMARY="$RUNNER_TEMP/WatchSensorLab-${CASE_SLUG}-summary.json"
          rm -rf "$RESULT" "$SUMMARY"

          echo "Case: $CASE_SLUG"
          echo "Simulator: $DEVICE_NAME ($DEVICE_UDID)"

          # Explicitly boot every destination, including contract targets.
          # watchOS simulators occasionally time out while booting on a shared
          # macOS runner; retry once from a clean shutdown before attributing
          # the failure to the product.
          for attempt in 1 2; do
            xcrun simctl shutdown "$DEVICE_UDID" >/dev/null 2>&1 || true
            xcrun simctl boot "$DEVICE_UDID" >/dev/null 2>&1 || true
            if xcrun simctl bootstatus "$DEVICE_UDID" -b; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "Simulator failed to boot after two attempts: $DEVICE_NAME ($DEVICE_UDID)" >&2
              exit 1
            fi
          done

          set +e
          if [ "$TARGET_PLATFORM" = "iphone" ] && [ "$TEST_KIND" = "contract" ]; then
            xcodebuild test \
              -project "$GITHUB_WORKSPACE/$APP_DIR/iphone/WatchSensorLab.xcodeproj" \
              -scheme WatchSensorLab \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
              -resultBundlePath "$RESULT" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
            rc=$?
          elif [ "$TARGET_PLATFORM" = "watch" ] && [ "$TEST_KIND" = "contract" ]; then
            xcodebuild test \
              -project "$GITHUB_WORKSPACE/$APP_DIR/watch/WatchSensorLabWatch.xcodeproj" \
              -scheme WatchSensorLabWatch \
              -configuration Debug \
              -destination "platform=watchOS Simulator,id=$DEVICE_UDID" \
              -resultBundlePath "$RESULT" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
            rc=$?
          elif [ "$TARGET_PLATFORM" = "iphone" ]; then
            xcodebuild test \
              -project "$GITHUB_WORKSPACE/$APP_DIR/iphone/WatchSensorLab.xcodeproj" \
              -scheme WatchSensorLabFinishUIHarness \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
              -only-testing:"WatchSensorLabFinishUITests/iPhoneFinishFlowUITests/${TEST_NAME}" \
              -resultBundlePath "$RESULT" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
            rc=$?
          else
            xcodebuild test \
              -project "$GITHUB_WORKSPACE/$APP_DIR/watch/WatchSensorLabWatch.xcodeproj" \
              -scheme WatchSensorLabWatchFinishUIHarness \
              -configuration Debug \
              -destination "platform=watchOS Simulator,id=$DEVICE_UDID" \
              -only-testing:"WatchSensorLabWatchFinishUITests/WatchFinishFlowUITests/${TEST_NAME}" \
              -resultBundlePath "$RESULT" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
            rc=$?
          fi
          set -e

          if [ "$TEST_KIND" = "ui" ] && [ -d "$RESULT" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RESULT" --compact > "$SUMMARY" 2>/dev/null || true
          fi

          xcrun simctl shutdown "$DEVICE_UDID" >/dev/null 2>&1 || true

          exit "$rc"

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-sensor-lab-test-failure-${{ github.sha }}-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/WatchSensorLab-${{ matrix.slug }}.xcresult
            ${{ runner.temp }}/WatchSensorLab-${{ matrix.slug }}-summary.json
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 6
