name: CloudWeightLab
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CloudWeightLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Models
        excludes:
          - .gitkeep
    preBuildScripts:
      - name: Generate app icon
        script: |
          set -euo pipefail
          python3 "$SRCROOT/../GENERATE_APP_ICON.py" "$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cloud Weight
        CFBundleShortVersionString: "0.11.0"
        CFBundleVersion: "11"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Cloud Weight utilise la caméra uniquement sur cet iPhone pour reconnaître le ciel, détourer les nuages puis estimer leur masse. Les images ne sont pas envoyées sur un serveur.
        NSLocalNetworkUsageDescription: Cloud Weight utilise le réseau local uniquement pour synchroniser vers votre PC les sessions diagnostic enregistrées localement sur cet iPhone.
        NSBonjourServices:
          - _cloudweight._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rzbck.cloudweightlab
        PRODUCT_NAME: CloudWeightLab
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CloudWeightLabTests

  CloudWeightLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Tests
    dependencies:
      - target: CloudWeightLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rzbck.cloudweightlab.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
