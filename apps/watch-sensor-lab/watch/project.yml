name: WatchSensorLabWatch
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WatchSensorLabWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
      - path: ../Shared/TrackerShared.swift
      - path: Assets.xcassets
    preBuildScripts:
      - name: Generate App Icon
        shell: /bin/bash
        script: |
          set -euo pipefail
          python3 "$SRCROOT/../GENERATE_APP_ICON.py" "$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Watch Tracker
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "5"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rzbck.watchsensorlab
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes:
          - workout-processing
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Watch Tracker utilise le GPS de l’Apple Watch pendant la session pour la vitesse, l'altitude et le tracé.
        NSMotionUsageDescription: Watch Tracker utilise les mouvements, le gyroscope, l’altimètre, les pas et la cadence pour suivre l’activité, fiabiliser le dénivelé et gérer le mode Auto.
        NSHealthShareUsageDescription: Watch Tracker lit votre fréquence cardiaque et les métriques d’entraînement pendant une session.
        NSHealthUpdateUsageDescription: Watch Tracker enregistre dans Santé les entraînements terminés et leur parcours GPS, et peut supprimer les données qu’il a lui-même créées sur demande.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rzbck.watchsensorlab.watchkitapp
        PRODUCT_NAME: WatchSensorLabWatch
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: Sources/WatchSensorLab.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
    scheme: {}
