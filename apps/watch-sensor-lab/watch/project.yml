name: WatchSensorLabWatch
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WatchSensorLabWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    preBuildScripts:
      - name: Generate App Icon
        shell: /bin/bash
        script: |
          set -euo pipefail
          python3 "$SRCROOT/../GENERATE_APP_ICON.py" "$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Watch Tracker
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rzbck.watchsensorlab
        WKRunsIndependentlyOfCompanionApp: false
        NSLocationWhenInUseUsageDescription: Watch Tracker utilise le GPS de l’Apple Watch pendant la session pour la vitesse, l’altitude et le tracé.
        NSHealthShareUsageDescription: Watch Tracker lit votre fréquence cardiaque et les métriques d’entraînement pendant une session.
        NSHealthUpdateUsageDescription: Watch Tracker utilise HealthKit pour la session en direct. Les sessions de test ne sont pas sauvegardées dans Santé.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rzbck.watchsensorlab.watchkitapp
        PRODUCT_NAME: WatchSensorLabWatch
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: Sources/WatchSensorLab.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
    scheme: {}
